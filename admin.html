<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Mimoo Portfolio</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Styles de base -->
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-container {
            background: white;
            padding: 2rem;
            border-radius: var(--border-radius-md);
            box-shadow: var(--box-shadow-lg);
            max-width: 600px;
            width: 100%;
            margin: 2rem;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .admin-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius-sm);
            font-size: 1rem;
        }

        .admin-btn {
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius-sm);
            font-size: 1rem;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .admin-btn:hover {
            background-color: var(--secondary-color);
        }

        .admin-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .status-message {
            padding: 0.75rem;
            border-radius: var(--border-radius-sm);
            margin-top: 1rem;
            text-align: center;
        }

        .status-success {
            background-color: rgba(34, 197, 94, 0.1);
            color: #16a34a;
            border: 1px solid #16a34a;
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid #dc2626;
        }

        .upload-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #eee;
        }

        .upload-section.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Administration Portfolio</h1>
            <p>Connexion pour gérer les images</p>
        </div>

        <form id="admin-login-form" class="admin-form">
            <div class="form-group">
                <label for="admin-password">Mot de passe administrateur</label>
                <input type="password" id="admin-password" required>
            </div>
            <button type="submit" class="admin-btn" id="login-btn">Se connecter</button>
        </form>

        <div id="status-message"></div>

        <div id="upload-section" class="upload-section hidden">
            <h2>Upload d'images</h2>
            <p>Ajoutez de nouvelles images à la galerie</p>

            <div class="upload-container">
                <div id="upload-drop-zone" class="upload-drop-zone">
                    <div class="upload-content">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Glissez-déposez vos images ici ou cliquez pour sélectionner</p>
                        <form id="image-upload-form" enctype="multipart/form-data">
                            <input type="file" id="image-file" accept="image/*" style="display: none;">
                            <button type="button" id="select-file-btn" class="cta-button">Sélectionner un fichier</button>
                        </form>
                    </div>
                </div>

                <div id="upload-status" class="upload-status"></div>

                <button type="submit" form="image-upload-form" id="upload-button" class="cta-button">
                    <i class="fas fa-upload"></i> Uploader l'image
                </button>
            </div>

            <div style="margin-top: 2rem; text-align: center;">
                <a href="index.html" class="admin-btn" style="background-color: var(--secondary-color);">Retour au portfolio</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script>
        // Admin authentication
        let isAuthenticated = false;
        let authToken = null;

        // Check if already authenticated on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedToken = localStorage.getItem('adminToken');
            if (savedToken) {
                authToken = savedToken;
                isAuthenticated = true;
                showUploadSection();
            }
        });

        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;

            try {
                const backendUrl = (window.CONFIG && window.CONFIG.BACKEND_UPLOAD_URL) || 'http://localhost:3001';
                const response = await fetch(`${backendUrl}/api/auth`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    isAuthenticated = true;
                    authToken = result.token;
                    // Store token for session persistence
                    localStorage.setItem('adminToken', authToken);
                    // Make token available globally for upload.js
                    window.authToken = authToken;
                    showUploadSection();
                    showStatus('Connexion réussie !', 'success');
                } else {
                    showStatus(result.error || 'Erreur d\'authentification', 'error');
                }
            } catch (error) {
                console.error('Auth error:', error);
                showStatus('Erreur de connexion au serveur', 'error');
            }
        });

        function showUploadSection() {
            document.getElementById('admin-login-form').style.display = 'none';
            document.getElementById('upload-section').classList.remove('hidden');
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status-message');
            statusDiv.className = `status-message status-${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';

            setTimeout(() => {
                statusDiv.style.display = 'none';
            }, 5000);
        }
    </script>
    <script src="js/upload.js"></script>
</body>
</html>
